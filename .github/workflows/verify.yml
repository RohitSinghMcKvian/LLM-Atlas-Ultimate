# The pre-merge gate: the same `npm run verify` (typecheck + tests) the repo
# documents for local use.
#
# The live provider test in lib/catalog/sync/live.test.ts skips itself when no
# API keys are present, so this passes without secrets.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run verify
